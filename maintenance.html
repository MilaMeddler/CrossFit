<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - CrossFit Competition</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-2xl w-full text-center">
        <!-- Logo -->
        <div class="mb-8">
            <img src="logo.jpeg"
                 alt="Black Monkeys CrossFit"
                 class="h-24 mx-auto mb-6 object-contain rounded-lg"
                 onerror="this.style.display='none'">
        </div>

        <!-- Maintenance Icon with Animation -->
        <div class="mb-8">
            <div class="inline-block">
                <svg class="w-24 h-24 text-orange-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M15 12a3 3 0 11-6 0 3 3 0 016 0z">
                    </path>
                </svg>
            </div>
        </div>

        <!-- Main Message -->
        <div class="bg-gray-800 border-2 border-orange-500 rounded-lg p-8 shadow-2xl">
            <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">
                Maintenance en cours
            </h1>

            <div class="h-1 w-24 bg-orange-500 mx-auto mb-6 rounded-full"></div>

            <p class="text-xl md:text-2xl text-gray-300 mb-6 leading-relaxed">
                L'application est temporairement indisponible.<br>
                Revenez bientôt !
            </p>

            <!-- Animated dots -->
            <div class="flex justify-center gap-2 mt-8">
                <div class="w-3 h-3 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0s"></div>
                <div class="w-3 h-3 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                <div class="w-3 h-3 bg-orange-500 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-gray-500 text-sm">
            <p>Black Monkeys CrossFit - Tournament Management</p>
        </div>
    </div>

    <style>
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .animate-bounce {
            animation: bounce 1.5s ease-in-out infinite;
        }
    </style>
</body>
</html>
