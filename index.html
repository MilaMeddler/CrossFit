<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Monkeys CrossFit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900">

<div class="min-h-screen flex flex-col items-center justify-center p-4 lg:p-8">
    <!-- Main Container -->
    <div class="w-full max-w-5xl">
        <!-- Logo with Overlay Buttons (Desktop only) -->
        <div class="relative bg-black rounded-lg overflow-hidden shadow-2xl">
            <img src="logo.jpeg"
                 alt="Black Monkeys CrossFit"
                 class="w-full h-auto"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display: none;" class="text-center p-12">
                <h1 class="text-5xl font-bold text-white mb-2">BLACK MONKEYS</h1>
                <h2 class="text-4xl font-bold text-white">CROSSFIT</h2>
                <p class="text-xl text-gray-400 mt-3">BOURG LES VALENCE</p>
            </div>

            <!-- Overlay Buttons (Desktop only - horizontal) -->
            <div class="hidden md:flex absolute inset-x-0 bottom-0 p-6 gap-4">
                <a href="athlete.html"
                   class="flex-1 bg-gray-800/90 backdrop-blur-sm border border-gray-600 text-white text-center py-3 px-4 text-base font-bold hover:bg-gray-700 transition-all shadow-lg rounded-lg">
                   Athlète
                </a>

                <a href="judge.html"
                   class="flex-1 bg-gray-800/90 backdrop-blur-sm border border-gray-600 text-white text-center py-3 px-4 text-base font-bold hover:bg-gray-700 transition-all shadow-lg rounded-lg">
                   Juge
                </a>

                <a href="leaderboard.html"
                   class="flex-1 bg-gray-800/90 backdrop-blur-sm border border-gray-600 text-white text-center py-3 px-4 text-base font-bold hover:bg-gray-700 transition-all shadow-lg rounded-lg">
                   Résultats
                </a>
            </div>
        </div>

        <!-- Mobile Buttons (Below logo - vertical) -->
        <div class="md:hidden mt-6 space-y-4">
            <a href="athlete.html"
               class="block w-full bg-gray-800 border-2 border-gray-700 text-white text-center py-6 px-6 text-xl font-bold hover:bg-gray-700 transition-all shadow-lg rounded-lg">
                Entrée Athlète
            </a>

            <a href="judge.html"
               class="block w-full bg-gray-800 border-2 border-gray-700 text-white text-center py-6 px-6 text-xl font-bold hover:bg-gray-700 transition-all shadow-lg rounded-lg">
                Entrée Juge
            </a>

            <a href="leaderboard.html"
               class="block w-full bg-gray-800 border-2 border-gray-700 text-white text-center py-6 px-6 text-xl font-bold hover:bg-gray-700 transition-all shadow-lg rounded-lg">
                Résultats
            </a>
        </div>

        <!-- Admin Button Below -->
        <div class="mt-6">
            <a href="admin.html"
               class="block w-full bg-gray-800 border border-gray-600 text-gray-300 text-center py-4 px-6 text-base font-semibold hover:bg-gray-700 transition-colors rounded-lg shadow-lg">
                Administration
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-gray-500 text-sm mt-8">
        <p>Black Monkeys CrossFit - Tournament Management</p>
    </footer>
</div>

</body>
</html>
