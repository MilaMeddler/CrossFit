<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrossFit Tournament</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white">

<div class="min-h-screen flex flex-col">
    <!-- Header -->
    <div class="w-full bg-gray-900 py-8">
        <h1 class="text-5xl font-bold text-center text-white">Black Monkeys CrossFit</h1>
        <p class="text-center text-gray-300 mt-2">Tournament Management</p>
    </div>

    <!-- Main Content -->
    <div class="flex-1 max-w-2xl mx-auto px-6 py-12 w-full">
        <h1 class="text-4xl font-bold text-center text-gray-900 mb-12">CrossFit Tournament</h1>

        <!-- Main Buttons -->
        <div class="space-y-4 mb-12">
            <a href="athlete.html"
               class="block w-full bg-white border-2 border-gray-800 text-gray-900 text-center py-6 px-8 text-xl font-semibold hover:bg-gray-800 hover:text-white transition-colors">
                🏋️ Entrée Athlète
            </a>

            <a href="judge.html"
               class="block w-full bg-white border-2 border-gray-800 text-gray-900 text-center py-6 px-8 text-xl font-semibold hover:bg-gray-800 hover:text-white transition-colors">
                ⚖️ Entrée Juge
            </a>

            <a href="leaderboard.html"
               class="block w-full bg-white border-2 border-gray-800 text-gray-900 text-center py-6 px-8 text-xl font-semibold hover:bg-gray-800 hover:text-white transition-colors">
                🏆 Tableau des Résultats
            </a>
        </div>

        <!-- Admin Button -->
        <div class="pt-8 border-t border-gray-300">
            <a href="admin.html"
               class="block w-full bg-gray-200 border border-gray-400 text-gray-700 text-center py-4 px-6 text-lg font-medium hover:bg-gray-300 transition-colors">
                👤 Administration
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-gray-500 text-sm py-6">
        <p>CrossFit Tournament Management System</p>
    </footer>
</div>

</body>
</html>
