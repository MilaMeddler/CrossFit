<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Monkeys CrossFit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900">

<div class="min-h-screen flex flex-col">
    <!-- Header with Logo -->
    <div class="w-full bg-black py-8">
        <div class="max-w-4xl mx-auto px-6">
            <img src="logo.jpeg"
                 alt="Black Monkeys CrossFit"
                 class="w-full max-w-2xl mx-auto h-auto"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display: none;" class="text-center">
                <h1 class="text-5xl font-bold text-white mb-2">BLACK MONKEYS</h1>
                <h2 class="text-4xl font-bold text-white">CROSSFIT</h2>
                <p class="text-xl text-gray-400 mt-3">BOURG LES VALENCE</p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="flex-1 max-w-3xl mx-auto px-6 py-16 w-full">
        <!-- Main Buttons -->
        <div class="space-y-6 mb-16">
            <a href="athlete.html"
               class="block w-full bg-gray-800 border-2 border-gray-700 text-white text-center py-8 px-10 text-2xl font-bold hover:bg-gray-700 hover:border-gray-600 transition-all shadow-lg rounded-lg">
                Entrée Athlète
            </a>

            <a href="judge.html"
               class="block w-full bg-gray-800 border-2 border-gray-700 text-white text-center py-8 px-10 text-2xl font-bold hover:bg-gray-700 hover:border-gray-600 transition-all shadow-lg rounded-lg">
                Entrée Juge
            </a>

            <a href="leaderboard.html"
               class="block w-full bg-gray-800 border-2 border-gray-700 text-white text-center py-8 px-10 text-2xl font-bold hover:bg-gray-700 hover:border-gray-600 transition-all shadow-lg rounded-lg">
                Résultats
            </a>
        </div>

        <!-- Admin Button -->
        <div class="pt-8 border-t border-gray-700">
            <a href="admin.html"
               class="block w-full bg-gray-800 border border-gray-600 text-gray-300 text-center py-6 px-8 text-xl font-semibold hover:bg-gray-700 transition-colors rounded-lg">
                Administration
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer class="text-center text-gray-500 text-lg py-8">
        <p>Black Monkeys CrossFit - Tournament Management</p>
    </footer>
</div>

</body>
</html>
