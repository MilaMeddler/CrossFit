<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Black Monkeys CrossFit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 min-h-screen">

<div class="flex flex-col items-center py-8 px-4">
    <div class="w-full max-w-2xl">

        <!-- Logo / Flag -->
        <div class="bg-black rounded-xl overflow-hidden shadow-2xl mb-8">
            <img src="logo.jpeg"
                 alt="Black Monkeys CrossFit"
                 class="w-full object-cover object-center"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <div style="display: none;" class="text-center p-12">
                <h1 class="text-5xl font-bold text-white mb-2">BLACK MONKEYS</h1>
                <h2 class="text-4xl font-bold text-white">CROSSFIT</h2>
                <p class="text-xl text-gray-400 mt-3">BOURG LES VALENCE</p>
            </div>
        </div>

        <!-- Main buttons: row 1 -->
        <div class="grid grid-cols-2 gap-4 mb-4">
            <a href="athlete.html"
               class="bg-gray-800 border-2 border-gray-700 text-white text-center py-7 px-4 text-lg font-bold hover:bg-gray-700 hover:border-gray-500 transition-all shadow-lg rounded-xl">
                Saisir mes résultats
            </a>
            <a href="register.html"
               class="bg-gray-800 border-2 border-gray-700 text-white text-center py-7 px-4 text-lg font-bold hover:bg-gray-700 hover:border-gray-500 transition-all shadow-lg rounded-xl">
                Inscription Équipe
            </a>
        </div>

        <!-- Main buttons: row 2 (centered) -->
        <div class="flex justify-center mb-10">
            <a href="leaderboard.html"
               class="w-1/2 bg-gray-800 border-2 border-gray-700 text-white text-center py-7 px-4 text-lg font-bold hover:bg-gray-700 hover:border-gray-500 transition-all shadow-lg rounded-xl">
                Tableau des résultats
            </a>
        </div>

        <!-- Separator -->
        <div class="border-t border-gray-700 mb-6"></div>

        <!-- Special access: small buttons -->
        <div class="grid grid-cols-2 gap-3">
            <a href="judge.html"
               class="bg-gray-900 border border-gray-700 text-gray-400 text-center py-3 px-4 text-sm font-semibold hover:bg-gray-800 hover:text-gray-200 transition-all rounded-lg">
                Juge
            </a>
            <a href="admin.html"
               class="bg-gray-900 border border-gray-700 text-gray-400 text-center py-3 px-4 text-sm font-semibold hover:bg-gray-800 hover:text-gray-200 transition-all rounded-lg">
                Admin
            </a>
        </div>

    </div>
</div>

</body>
</html>
