<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Équipe - CrossFit Competition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 min-h-screen pb-12">

<header class="bg-gray-800 shadow-lg mb-8">
    <div class="max-w-2xl mx-auto px-4 py-5 flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-bold text-white">Inscription Équipe</h1>
            <p class="text-gray-400 text-sm mt-1">Enregistrez votre équipe pour le tournoi</p>
        </div>
        <a href="index.html" class="text-gray-400 hover:text-white text-sm">← Accueil</a>
    </div>
</header>

<div class="max-w-2xl mx-auto px-4 space-y-6">

    <!-- Tournament selection -->
    <div class="bg-gray-800 rounded-lg p-6">
        <label class="block text-base font-semibold text-gray-200 mb-3">Tournoi</label>
        <select id="tournament-select" class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-4 py-3 text-base">
            <option value="">-- Chargement... --</option>
        </select>
        <p id="no-team-tournaments" class="hidden text-amber-400 text-sm mt-2">Aucun tournoi par équipes disponible actuellement.</p>
    </div>

    <!-- Registration form -->
    <div id="registration-form" class="hidden space-y-6">

        <!-- Team name -->
        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-lg font-bold text-white mb-4">🏆 Nom de l'équipe</h2>
            <input type="text" id="team-name"
                   placeholder="Ex: Les Invincibles"
                   maxlength="60"
                   class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-4 py-3 text-lg placeholder-gray-400 focus:border-red-500 outline-none">
        </div>

        <!-- Members -->
        <div class="bg-gray-800 rounded-lg p-6">
            <h2 class="text-lg font-bold text-white mb-1">👥 Membres de l'équipe</h2>
            <p id="members-count-label" class="text-gray-400 text-sm mb-4"></p>
            <div id="members-list" class="space-y-3"></div>
        </div>

        <!-- Division (regular tournaments only) -->
        <div id="division-block" class="bg-gray-800 rounded-lg p-6 hidden">
            <h2 class="text-lg font-bold text-white mb-4">🏅 Division</h2>
            <div id="division-buttons" class="flex flex-wrap gap-3"></div>
        </div>

        <!-- Submit -->
        <button id="submit-btn"
                class="w-full bg-red-600 hover:bg-red-700 text-white py-4 rounded-lg font-bold text-xl transition-colors shadow-lg">
            Inscrire l'équipe
        </button>

    </div>

    <!-- Success message -->
    <div id="success-block" class="hidden bg-green-900 border-2 border-green-600 rounded-lg p-6 text-center">
        <div class="text-4xl mb-3">🎉</div>
        <h2 class="text-2xl font-bold text-white mb-2">Équipe inscrite !</h2>
        <p id="success-team-name" class="text-green-300 text-lg font-semibold mb-1"></p>
        <p id="success-members" class="text-gray-400 text-sm mb-4"></p>
        <div class="flex gap-3 justify-center flex-wrap">
            <button id="register-another-btn"
                    class="bg-gray-700 hover:bg-gray-600 text-white px-5 py-3 rounded-lg font-semibold transition-colors">
                Inscrire une autre équipe
            </button>
            <a id="leaderboard-link" href="leaderboard.html"
               class="bg-green-700 hover:bg-green-600 text-white px-5 py-3 rounded-lg font-semibold transition-colors">
                Voir les résultats
            </a>
        </div>
    </div>

    <!-- Existing teams list -->
    <div id="teams-list-block" class="hidden bg-gray-800 rounded-lg p-6">
        <h2 class="text-base font-bold text-gray-300 mb-4">Équipes déjà inscrites</h2>
        <div id="teams-list" class="space-y-2"></div>
    </div>

</div>

<script>
const SUPABASE_URL = 'https://gbdanipvnqrggjjoebtn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiZGFuaXB2bnFyZ2dqam9lYnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNjYyNzUsImV4cCI6MjA4MDk0MjI3NX0.cRSuKatOSWgcbyhqAJ_5oWnENZK5sQZaZiGL15uytME';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let currentTournamentId = null;
let currentTeamSize = 2;
let currentTournamentIsOpen = false;

const DIVISION_LABELS = { elite: 'Elite', rx: 'RX', intermediaire: 'Intermédiaire', scaled: 'Scaled', foundations: 'Foundations' };

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
}

function showError(msg) {
    const existing = document.getElementById('error-toast');
    if (existing) existing.remove();
    const div = document.createElement('div');
    div.id = 'error-toast';
    div.className = 'fixed top-4 right-4 bg-red-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 max-w-sm';
    div.textContent = msg;
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 5000);
}

function renderMemberFields() {
    const list = document.getElementById('members-list');
    list.innerHTML = '';
    for (let i = 1; i <= currentTeamSize; i++) {
        const row = document.createElement('div');
        row.innerHTML = `
            <input type="text" id="member-${i}"
                   placeholder="Athlète ${i} — Prénom Nom"
                   class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-4 py-3 placeholder-gray-400 focus:border-red-500 outline-none">
        `;
        list.appendChild(row);
    }
    document.getElementById('members-count-label').textContent =
        `Entrez les ${currentTeamSize} membres de votre équipe`;
}

function getMembers() {
    return Array.from(document.querySelectorAll('#members-list input'))
        .map(i => i.value.trim());
}

function resetForm() {
    document.getElementById('team-name').value = '';
    renderMemberFields();
}

// Load team tournaments
async function loadTournaments() {
    const { data, error } = await sb
        .from('tournaments')
        .select('id, name, team_size, is_open, active_divisions')
        .eq('competition_type', 'team')
        .order('id', { ascending: false });

    const select = document.getElementById('tournament-select');

    if (error || !data || data.length === 0) {
        select.innerHTML = '<option value="">-- Aucun tournoi disponible --</option>';
        document.getElementById('no-team-tournaments').classList.remove('hidden');
        return;
    }

    select.innerHTML = '<option value="">-- Sélectionner un tournoi --</option>' +
        data.map(t => `<option value="${t.id}" data-size="${t.team_size || 4}" data-open="${t.is_open ? '1' : '0'}" data-divisions='${JSON.stringify(t.active_divisions || ["rx","scaled","foundations"])}'>${escapeHtml(t.name)}</option>`).join('');
}

// Load registered teams for selected tournament
async function loadTeams(tournamentId) {
    const { data } = await sb
        .from('teams')
        .select('id, team_name, member_names')
        .eq('tournament_id', tournamentId)
        .order('team_name');

    const block = document.getElementById('teams-list-block');
    const list = document.getElementById('teams-list');

    if (!data || data.length === 0) {
        block.classList.add('hidden');
        return;
    }

    block.classList.remove('hidden');
    list.innerHTML = data.map(t => {
        const members = (t.member_names || []).join(', ');
        return `
            <div class="py-2 border-b border-gray-700 last:border-0">
                <div class="font-semibold text-white">${escapeHtml(t.team_name)}</div>
                <div class="text-gray-400 text-sm">${escapeHtml(members)}</div>
            </div>`;
    }).join('');
}

function renderDivisionButtons(divisions) {
    const block = document.getElementById('division-block');
    const container = document.getElementById('division-buttons');
    container.innerHTML = divisions.map(d => `
        <button type="button" data-div="${d}"
            class="reg-div-btn px-5 py-3 rounded-lg border-2 border-gray-600 text-white font-semibold hover:border-red-500 transition-colors">
            ${DIVISION_LABELS[d] || d}
        </button>`).join('');
    container.querySelectorAll('.reg-div-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            container.querySelectorAll('.reg-div-btn').forEach(b => {
                b.classList.remove('border-red-500', 'bg-red-900');
                b.classList.add('border-gray-600');
            });
            btn.classList.remove('border-gray-600');
            btn.classList.add('border-red-500', 'bg-red-900');
        });
    });
    block.classList.remove('hidden');
}

// Tournament selection
document.getElementById('tournament-select').addEventListener('change', (e) => {
    const selected = e.target.options[e.target.selectedIndex];
    currentTournamentId = e.target.value ? parseInt(e.target.value) : null;

    if (currentTournamentId) {
        currentTeamSize = parseInt(selected.dataset.size) || 4;
        currentTournamentIsOpen = selected.dataset.open === '1';
        resetForm();

        if (!currentTournamentIsOpen) {
            const divisions = JSON.parse(selected.dataset.divisions || '["rx","scaled","foundations"]');
            renderDivisionButtons(divisions);
        } else {
            document.getElementById('division-block').classList.add('hidden');
        }

        document.getElementById('registration-form').classList.remove('hidden');
        document.getElementById('success-block').classList.add('hidden');
        loadTeams(currentTournamentId);
    } else {
        document.getElementById('registration-form').classList.add('hidden');
        document.getElementById('teams-list-block').classList.add('hidden');
        document.getElementById('division-block').classList.add('hidden');
    }
});

// Submit registration
document.getElementById('submit-btn').addEventListener('click', async () => {
    if (!currentTournamentId) return;

    const teamName = document.getElementById('team-name').value.trim();
    const members = getMembers();

    if (!teamName) return showError('Veuillez entrer un nom d\'équipe');
    const emptyCount = members.filter(m => m === '').length;
    if (emptyCount > 0) return showError(`Veuillez remplir tous les ${currentTeamSize} champs membres`);

    let division = null;
    if (!currentTournamentIsOpen) {
        const selectedDiv = document.querySelector('#division-buttons .reg-div-btn.border-red-500');
        if (!selectedDiv) return showError('Veuillez sélectionner une division');
        division = selectedDiv.dataset.div;
    }

    // Check duplicate team name
    const { data: dupTeam } = await sb
        .from('teams')
        .select('id')
        .eq('tournament_id', currentTournamentId)
        .ilike('team_name', teamName)
        .maybeSingle();

    if (dupTeam) return showError(`Une équipe "${teamName}" est déjà inscrite pour ce tournoi.`);

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'Inscription en cours...';

    try {
        const { error } = await sb.from('teams').insert({
            tournament_id: currentTournamentId,
            team_name: teamName,
            member_names: members,
            division: division
        });

        if (error) throw new Error(error.message);

        // Success
        document.getElementById('registration-form').classList.add('hidden');
        document.getElementById('success-block').classList.remove('hidden');
        document.getElementById('success-team-name').textContent = teamName;
        document.getElementById('success-members').textContent = members.join(' · ');
        document.getElementById('leaderboard-link').href =
            `leaderboard.html?tournament=${currentTournamentId}`;

        loadTeams(currentTournamentId);

    } catch (err) {
        showError(`❌ Erreur: ${err.message}`);
    } finally {
        btn.disabled = false;
        btn.textContent = 'Inscrire l\'équipe';
    }
});

// Register another team
document.getElementById('register-another-btn').addEventListener('click', () => {
    document.getElementById('success-block').classList.add('hidden');
    document.getElementById('registration-form').classList.remove('hidden');
    resetForm();
});

loadTournaments();
</script>

</body>
</html>
