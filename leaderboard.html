// Load tournaments

// Update category filter based on tournament type
function updateCategoryFilter(tournament) {
    const sel = document.getElementById('category-select');
    const savedValue = sel.value;
    if (tournament && tournament.is_open) {
        sel.innerHTML = `
            <option value="all">Tous</option>

            <option value="scaled">Scaled (Intermédiaire)</option>
            <option value="foundations">Foundations (Débutant)</option>
        `;
    } else {
        sel.innerHTML = `
            <option value="all">Tous</option>
            <option value="RX">RX</option>
            <option value="INTER">Scaled</option>
            <option value="SCALE">Foundations</option>
        `;
    }
    // Restore selection if it still exists, else reset to 'all'
    if ([...sel.options].some(o => o.value === savedValue)) {
        sel.value = savedValue;
    } else {
        sel.value = 'all';
        currentCategory = 'all';
    }
}

// Division priority for OPEN ranking (lower = better)
function divisionPriority(division) {
    if (division === 'rx') return 1;
    if (division === 'scaled') return 2;
    if (division === 'foundations') return 3;
    return 4;
}

// Compare two scores for a WOD in OPEN format
// Returns negative if a is better than b, positive if b is better
function compareOpenScores(a, b, wod) {
    // 1. Division priority (rx < scaled < foundations)
    const divA = divisionPriority(a.division);
    const divB = divisionPriority(b.division);
    if (divA !== divB) return divA - divB;

    // 2. Result comparison within same division
    if (wod.wod_type === 'reps') {
        // AMRAP: more reps = better
        const repsA = a.value_int || a.value_decimal || 0;
        const repsB = b.value_int || b.value_decimal || 0;
        if (repsA !== repsB) return repsB - repsA; // higher is better
    } else {
        // For Time
        const aCompleted = a.is_completed !== false; // null/undefined treated as true
        const bCompleted = b.is_completed !== false;
        if (aCompleted && bCompleted) {
            // Both finished: lower time = better
            const tA = a.value_time || 999999;
            const tB = b.value_time || 999999;
            if (tA !== tB) return tA - tB;
        } else if (aCompleted && !bCompleted) {
            return -1; // a finished, b didn't — a is better
        } else if (!aCompleted && bCompleted) {
            return 1;  // b finished — b is better
        } else {
            // Both hit time cap: more reps = better
            const repsA = a.value_int || 0;
            const repsB = b.value_int || 0;
            if (repsA !== repsB) return repsB - repsA;
        }
    }

    return 0;
}

// Compare two scores for a WOD in regular format
// wod is optional — used to determine sort direction for AMRAP vs For Time
function compareRegularScores(a, b, wod) {
    if (wod && wod.wod_type === 'time') {
        const aCompleted = a.is_completed !== false;
        const bCompleted = b.is_completed !== false;
        // Completed always beats timecap
        if (aCompleted && !bCompleted) return -1;
        if (!aCompleted && bCompleted) return 1;
        if (aCompleted && bCompleted) {
            // Both finished: lower time = better
            return (a.value_time || 999999) - (b.value_time || 999999);
        } else {
            // Both hit timecap: more reps = better
            return (b.value_int || 0) - (a.value_int || 0);
        }
    }
    // AMRAP / reps: more = better
    if (wod && wod.wod_type === 'reps') {
        const repsA = a.value_int || a.value_decimal || 0;
        const repsB = b.value_int || b.value_decimal || 0;
        return repsB - repsA;
    }
    // Weight: higher = better
    const aVal = a.value_int || a.value_decimal || 0;
    const bVal = b.value_int || b.value_decimal || 0;
    return bVal - aVal;
}

// Filter participants based on current filters
function filterParticipants(participantList) {
    return participantList.filter(p => {
        if (currentGender !== 'all' && p.gender !== currentGender) return false;
        if (currentCategory !== 'all' && currentTournament) {
            if (currentTournament.is_open) {
                // For OPEN: only include athletes whose ALL existing results are in selected division
                // Athletes with no results yet are always included
                const myScores = scores.filter(s =>
                    p.type === 'team' ? s.team_id === p.teamId : s.athlete_id === p.athleteId
                );
                if (myScores.length > 0 && !myScores.every(s => s.division === currentCategory)) {
                    return false;
                }
            } else {
                if (p.level !== currentCategory) return false;
            }
        }
        return true;
    });
}

// Get division profile for an athlete: 'rx'|'scaled'|'foundations'|'mixed'|null
function athleteDivisionProfile(wodScoresData) {
    const divisions = Object.values(wodScoresData)
        .filter(d => d.score && d.score.division)
        .map(d => d.score.division);
    if (divisions.length === 0) return null;
    const unique = [...new Set(divisions)];
    return unique.length === 1 ? unique[0] : 'mixed';
}

// Colored dot for division profile (only for pure single-division)
function divisionDot(profile) {
    if (profile === 'rx')          return '<span class="inline-block w-2.5 h-2.5 rounded-full bg-orange-400 mr-2 align-middle" title="RX"></span>';
    if (profile === 'scaled')      return '<span class="inline-block w-2.5 h-2.5 rounded-full bg-blue-400 mr-2 align-middle" title="Scaled"></span>';
    if (profile === 'foundations') return '<span class="inline-block w-2.5 h-2.5 rounded-full bg-green-400 mr-2 align-middle" title="Foundations"></span>';
    if (profile === 'mixed')       return '<span class="inline-block w-2.5 h-2.5 rounded-full bg-gray-500 mr-2 align-middle" title="Mixte"></span>';
    return '';
}

// Calculate OPEN rankings (CrossFit Open algorithm)
function calculateOpenRankings() {
    const filtered = filterParticipants(participants);
    const allWodScores = scores.filter(s => {
        const wod = wods.find(w => w.id === s.workout_id);
        return wod != null;
    });

    // For OPEN, category filter is applied per-WOD based on division
    // But we show all filtered participants (by gender)
    // Each WOD rank is calculated within the category (division) filter

    const rankings = [];

    filtered.forEach(participant => {
        const participantWodData = {};
        let totalPoints = 0;
        const wodRanks = []; // for tiebreak

        wods.forEach(wod => {
            // Get this participant's score for this WOD
            const myScore = scores.find(s => {
                if (s.workout_id !== wod.id) return false;
                if (participant.type === 'team') return s.team_id === participant.teamId;
                return s.athlete_id === participant.athleteId;
            });

            // For OPEN: rank within same division (and gender-filtered participants)
            // Collect all scores for this WOD from gender-filtered participants
            const wodScores = scores.filter(s => {
                if (s.workout_id !== wod.id) return false;
                const p = participants.find(pp => {
                    if (pp.type === 'team') return s.team_id === pp.teamId;
                    return s.athlete_id === pp.athleteId;
                });
                return p && filterParticipants([p]).length > 0;
            });

            // Determine which division to rank in
            // If category filter is set, only rank among that division
            // If 'all', rank within participant's own division (Open standard)
            const myDivision = myScore ? myScore.division : null;

            // Get competitors in same division
            const divisionFilter = currentCategory !== 'all' ? currentCategory : myDivision;
            const sameDiv = divisionFilter
                ? wodScores.filter(s => s.division === divisionFilter)
                : wodScores;

            const totalInCategory = currentCategory !== 'all'
                ? filtered.filter(p => {
                    // Count participants who have a score in this division
                    const theirScore = scores.find(s =>
                        s.workout_id === wod.id &&
                        (p.type === 'team' ? s.team_id === p.teamId : s.athlete_id === p.athleteId)
                    );
                    return theirScore ? theirScore.division === currentCategory : true;
                }).length
                : filtered.length;

            if (myScore && (currentCategory === 'all' || myScore.division === currentCategory)) {
                // Sort same-division scores using OPEN algorithm
                const sorted = [...sameDiv].sort((a, b) => compareOpenScores(a, b, wod));
                const rank = sorted.findIndex(s => s.id === myScore.id) + 1;
                participantWodData[wod.id] = { rank, score: myScore };
                totalPoints += rank;
                wodRanks.push(rank);
            } else {
                // No score or wrong division: last place in category
                const lastPlace = totalInCategory || filtered.length;
                participantWodData[wod.id] = { rank: lastPlace, score: null };
                totalPoints += lastPlace;
                wodRanks.push(lastPlace);
            }
        });

        rankings.push({
            participant,
            wodScores: participantWodData,
            totalPoints,
            wodRanks: [...wodRanks].sort((a, b) => a - b) // sorted for tiebreak
        });
    });

    // Sort: lower totalPoints = better; tiebreak = compare sorted WOD rank arrays
    rankings.sort((a, b) => {
        if (a.totalPoints !== b.totalPoints) return a.totalPoints - b.totalPoints;
        // Tiebreak: compare sorted arrays element by element
        for (let i = 0; i < Math.min(a.wodRanks.length, b.wodRanks.length); i++) {
            if (a.wodRanks[i] !== b.wodRanks[i]) return a.wodRanks[i] - b.wodRanks[i];
        }
        return 0;
    });

    return rankings;
}

// Calculate regular rankings
function calculateRankings() {
    if (currentTournament && currentTournament.is_open) {
        return calculateOpenRankings();
    }

    const filtered = filterParticipants(participants);
    const rankings = [];

    filtered.forEach(participant => {
        const participantScores = {};
        let totalPoints = 0;

        wods.forEach(wod => {
            const score = scores.find(s => {
                const matchesWod = s.workout_id === wod.id;
                if (participant.type === 'team') {
                    return matchesWod && s.team_id === participant.teamId;
                } else {
                    return matchesWod && s.athlete_id === participant.athleteId;
                }
            });

            const wodScores = scores.filter(s => s.workout_id === wod.id);
            const filteredWodScores = wodScores.filter(s => {
                const scoreParticipant = participants.find(p => {
                    if (p.type === 'team') return s.team_id === p.teamId;
                    return s.athlete_id === p.athleteId;
                });
                return scoreParticipant && filterParticipants([scoreParticipant]).length > 0;
            });

            filteredWodScores.sort((a, b) => compareRegularScores(a, b, wod));

            if (score) {
                const rank = filteredWodScores.findIndex(s => s.id === score.id) + 1;
                participantScores[wod.id] = { rank, score };
                totalPoints += rank;
            } else {
                const lastPlace = filtered.length;
                participantScores[wod.id] = { rank: lastPlace, score: null };
                totalPoints += lastPlace;
            }
        });

        rankings.push({
            participant,
            wodScores: participantScores,
            totalPoints
        });
    });

    rankings.sort((a, b) => a.totalPoints - b.totalPoints);
    return rankings;
}

// Render
function render() {
    if (currentWod === 'overall') {
        renderOverall();
    } else {
        renderSingleWod(parseInt(currentWod));
    }
}

// Format result for display
function formatResult(score, wod) {
    if (!score) return '-';

    if (score.value_time) {
        const minutes = Math.floor(score.value_time / 60);
        const seconds = score.value_time % 60;
        return `${minutes}:${seconds.toString().padStart(2, '0')}`;
    } else if (score.value_int !== null && score.value_int !== undefined) {
        // Check if this is a time-cap reps (is_completed = false)
        if (score.is_completed === false) {
            return `${score.value_int} reps*`;
        }
        return score.value_int.toString();
    } else if (score.value_decimal !== null && score.value_decimal !== undefined) {
        return score.value_decimal.toString();
    } else {
        return '-';
    }
}

// Get display label for level/division
function levelLabel(level) {
    if (!level) return '-';
    const map = { RX: 'RX', INTER: 'Scaled', SCALE: 'Foundations', rx: 'RX', scaled: 'Scaled', foundations: 'Foundations' };
    return map[level] || level;
}

function levelBadgeClass(level) {
    if (level === 'RX' || level === 'rx') return 'bg-orange-900 text-orange-300';
    if (level === 'INTER' || level === 'scaled') return 'bg-blue-900 text-blue-300';
    return 'bg-green-900 text-green-300';
}

// Get division label for OPEN score
function scoreDivisionLabel(score) {
    if (!score || !score.division) return null;
    return levelLabel(score.division);
}

    const headerRow = document.getElementById('table-header');

    // Headers
    headerRow.innerHTML = `
        <th class="text-left py-3 px-4">Rang</th>
        <th class="text-left py-3 px-4">Participant</th>
        ${!isOpen ? `<th class="text-center py-3 px-4 hidden sm:table-cell">Catégorie</th>` : ''}
        ${wods.map(w => `<th class="text-center py-3 px-2 hidden sm:table-cell">WOD ${w.wod_number}</th>`).join('')}
        <th class="text-center py-3 px-4">Total</th>
    `;

    const colSpan = (isOpen ? 2 : 3) + wods.length + 1;
    if (rankings.length === 0) {
        tbody.innerHTML = `<tr><td colspan="${colSpan}" class="text-center py-8 text-gray-500">Aucun résultat</td></tr>`;
        return;
    }

    tbody.innerHTML = rankings.map((r, index) => {
        // Calculate rank with tie handling: same totalPoints = same rank
        const firstWithSamePoints = rankings.findIndex(rr => rr.totalPoints === r.totalPoints);
        const rank = firstWithSamePoints + 1;
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

        const wodCells = wods.map(w => {
            const wodData = r.wodScores[w.id];
            const place = wodData?.rank || '-';
            const result = formatResult(wodData?.score, w);
            const divLabel = isOpen && wodData?.score ? `<div class="text-gray-500 text-xs">${levelLabel(wodData.score.division)}</div>` : '';

            return `<td class="py-3 px-2 text-center text-xs hidden sm:table-cell">
                <div class="font-mono font-semibold">${result}</div>
                ${divLabel}
                <div class="text-gray-500 text-xs mt-0.5">(${place})</div>
            </td>`;
        }).join('');

        const categoryCell = !isOpen ? `
                <td class="py-3 px-4 text-center hidden sm:table-cell">
                    <span class="px-2 py-1 rounded text-xs font-semibold ${levelBadgeClass(r.participant.level)}">${levelLabel(r.participant.level)}</span>
                </td>` : '';

        return `
            <tr class="border-b border-gray-700 ${rankClass}">
                <td class="py-3 px-4 font-bold text-xl">${rank}</td>
                <td class="py-3 px-4 font-semibold">
                    ${isOpen ? divisionDot(athleteDivisionProfile(r.wodScores)) : ''}${r.participant.name}
                </td>
                ${categoryCell}
                ${wodCells}
                <td class="py-3 px-4 text-center font-bold text-xl">${r.totalPoints}</td>
            </tr>
        `;
    }).join('');
}

// Render single WOD leaderboard
function renderSingleWod(wodId) {
    const wod = wods.find(w => w.id === wodId);
    if (!wod) return;

    document.getElementById('leaderboard-title').textContent = `WOD ${wod.wod_number}`;
    document.getElementById('leaderboard-subtitle').textContent = wod.description || '';

    const isOpen = currentTournament && currentTournament.is_open;
    const filtered = filterParticipants(participants);
    const wodScores = scores.filter(s => s.workout_id === wodId);

    // Get all participants with their scores (including those without results)
    const results = filtered.map(p => {
        const score = wodScores.find(s => {
            if (p.type === 'team') return s.team_id === p.teamId;
            return s.athlete_id === p.athleteId;
        });
        // For OPEN: skip if category filter is set and division doesn't match
        if (isOpen && currentCategory !== 'all' && score && score.division !== currentCategory) {
            return null;
        }
        return { participant: p, score };
    }).filter(Boolean);

    // Separate participants with scores and without scores
    const withScores = results.filter(r => r.score);
    const withoutScores = results.filter(r => !r.score);

    // Sort participants with scores
    if (isOpen) {
        withScores.sort((a, b) => compareOpenScores(a.score, b.score, wod));
    } else {
        withScores.sort((a, b) => compareRegularScores(a.score, b.score, wod));
    }

    // Combine: participants with scores first, then those without
    const sortedResults = [...withScores, ...withoutScores];
    const lastPlace = filtered.length;

    const headerRow = document.getElementById('table-header');
    const tbody = document.getElementById('leaderboard-tbody');

    headerRow.innerHTML = `
        <th class="text-left py-3 px-4">Rang</th>
        <th class="text-left py-3 px-4">Participant</th>
        <th class="text-center py-3 px-4 hidden sm:table-cell">${isOpen ? 'Division' : 'Catégorie'}</th>
        <th class="text-center py-3 px-4">Résultat</th>
        <th class="text-center py-3 px-4">Points</th>
    `;

    if (sortedResults.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center py-8 text-gray-500">Aucun participant</td></tr>';
        return;
    }

    tbody.innerHTML = sortedResults.map((r, index) => {
        const rank = r.score ? (index + 1) : lastPlace;
        const rankClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : '';

        const result = formatResult(r.score, wod);

        // For OPEN: show division from score only (never use registration level)
        // For regular: show registration level
        const displayLevel = isOpen ? (r.score ? r.score.division : null) : r.participant.level;

        return `
            <tr class="border-b border-gray-700 ${rankClass}">
                <td class="py-3 px-4 font-bold text-lg">${rank}</td>
                <td class="py-3 px-4 font-semibold">${r.participant.name}</td>
                <td class="py-3 px-4 text-center hidden sm:table-cell">
                    ${displayLevel
                        ? `<span class="px-2 py-1 rounded text-xs font-semibold ${levelBadgeClass(displayLevel)}">${levelLabel(displayLevel)}</span>`
                        : '<span class="text-gray-600 text-xs">—</span>'}
                </td>
                <td class="py-3 px-4 text-center font-mono">${result}</td>
                <td class="py-3 px-4 text-center font-bold text-xl">${rank}</td>
            </tr>
        `;
    }).join('');
}

function updateLastUpdate() {
    const now = new Date();
    const time = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    document.getElementById('last-update').textContent = time;
}

function startAutoRefresh() {
    setInterval(async () => {
        await loadTournamentData();
    }, 10000);
}

init();
