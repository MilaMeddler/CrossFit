<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrée Juge - CrossFit Competition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900">

<!-- LOGIN MODAL -->
<div id="login-modal" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-lg shadow-2xl p-8 max-w-md w-full mx-4 border border-gray-700">
        <h1 class="text-3xl font-bold mb-2 text-center text-white">Accès Juge</h1>
        <p class="text-gray-300 mb-6 text-center">Entrez le mot de passe du tournoi</p>

        <input type="password" id="judge-password-input"
               class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 mb-4 text-center text-xl placeholder-gray-400"
               placeholder="Mot de passe">

        <button id="judge-login-btn"
                class="w-full bg-red-600 text-white py-4 rounded-lg font-bold hover:bg-red-700 text-xl transition-colors">
            Connexion
        </button>

        <p id="login-error" class="text-red-400 text-sm mt-3 text-center hidden">Mot de passe incorrect</p>

        <a href="index.html" class="block text-center text-gray-400 hover:text-gray-200 mt-6 text-sm">
            ← Retour à l'accueil
        </a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content" class="hidden min-h-screen pb-8">
    <header class="bg-gray-800 shadow-lg mb-6">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-3">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-white">Interface Juge</h1>
                    <p id="tournament-name" class="text-gray-300 text-lg mt-1"></p>
                </div>
                <div class="flex gap-3 flex-shrink-0">
                    <a href="leaderboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-semibold">
                        Résultats
                    </a>
                    <button id="logout-btn" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-semibold">
                        🚪 Exit
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4">
        <!-- RESULT ENTRY FORM -->
        <div class="bg-gray-800 rounded-lg shadow-xl p-8">
            <h2 class="text-2xl font-bold mb-6 text-white">Saisie de résultat</h2>

            <div class="space-y-6">
                <!-- Athlete Selection -->
                <div>
                    <label class="block text-base font-semibold text-gray-200 mb-3">Participant</label>
                    <select id="athlete-select" class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-lg">
                        <option value="">-- Sélectionner un participant --</option>
                    </select>
                </div>

                <!-- WOD Selection -->
                <div>
                    <label class="block text-base font-semibold text-gray-200 mb-3">WOD</label>
                    <select id="wod-select" class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-lg">
                        <option value="">-- Sélectionner un WOD --</option>
                    </select>
                </div>

                <!-- WOD Description -->
                <div id="wod-description" class="hidden bg-gradient-to-r from-gray-700 to-gray-600 border-2 border-red-600 p-6 rounded-lg shadow-lg">
                    <h3 class="font-bold text-white mb-4 text-xl">
                        Description du WOD
                    </h3>
                    <p id="wod-description-text" class="text-lg text-gray-100 whitespace-pre-wrap font-medium leading-relaxed"></p>
                </div>

                <!-- Regular Result Input -->
                <div id="result-regular" class="hidden">
                    <label class="block text-base font-semibold text-gray-200 mb-3">Résultat</label>
                    <input type="text" id="result-value"
                           placeholder="Ex: 150, 85kg"
                           class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-xl placeholder-gray-400">
                </div>

                <!-- Time Result Input -->
                <div id="result-time" class="hidden">
                    <!-- Timecap checkbox -->
                    <div class="mb-4">
                        <label class="flex items-center gap-3 cursor-pointer">
                            <input type="checkbox" id="result-is-completed" checked
                                   class="w-6 h-6 accent-orange-500">
                            <span class="text-gray-200 font-semibold text-lg">WOD terminé (sans time cap)</span>
                        </label>
                    </div>

                    <!-- Time inputs (when completed) -->
                    <div id="time-inputs-block">
                        <label class="block text-base font-semibold text-gray-200 mb-3">Temps (For Time)</label>
                        <div class="flex gap-4 items-center">
                            <div class="flex-1">
                                <input type="number" id="result-minutes" min="0" max="999" placeholder="00"
                                       class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-center text-3xl font-mono">
                                <p class="text-sm text-gray-300 text-center mt-2">minutes</p>
                            </div>
                            <span class="text-4xl font-bold text-gray-400 pb-8">:</span>
                            <div class="flex-1">
                                <input type="number" id="result-seconds" min="0" max="59" placeholder="00"
                                       class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-center text-3xl font-mono">
                                <p class="text-sm text-gray-300 text-center mt-2">secondes</p>
                            </div>
                        </div>
                        <p class="text-sm text-gray-400 mt-3">Exemple: 12 minutes 34 secondes = 12:34</p>
                    </div>

                    <!-- Reps at time cap -->
                    <div id="timecap-reps-block" class="hidden">
                        <label class="block text-base font-semibold text-gray-200 mb-3">Répétitions au time cap</label>
                        <input type="number" id="result-timecap-reps" min="0" placeholder="0"
                               class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-xl text-center font-mono">
                    </div>
                </div>

                <!-- Submit Button -->
                <button id="submit-result-btn"
                        class="w-full bg-red-600 text-white py-5 rounded-lg font-bold text-xl hover:bg-red-700 transition-colors shadow-lg hidden">
                    Enregistrer le résultat
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// SUPABASE CONFIG
const SUPABASE_URL = 'https://gbdanipvnqrggjjoebtn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiZGFuaXB2bnFyZ2dqam9lYnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNjYyNzUsImV4cCI6MjA4MDk0MjI3NX0.cRSuKatOSWgcbyhqAJ_5oWnENZK5sQZaZiGL15uytME';
var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// STATE
let currentTournament = null;
let athletes = [];
let wods = [];

// UTILITY
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showStatus(msg, isError = false) {
    const existing = document.getElementById('status-message');
    if (existing) existing.remove();

    const div = document.createElement('div');
    div.id = 'status-message';
    div.className = `fixed top-4 right-4 ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
    div.textContent = msg;
    document.body.appendChild(div);

    setTimeout(() => div.remove(), 4000);
}

// LOGIN
document.getElementById('judge-login-btn').addEventListener('click', async () => {
    const password = document.getElementById('judge-password-input').value.trim();

    if (!password) {
        return alert('Veuillez entrer un mot de passe');
    }

    // Find tournament by judge password
    const { data, error } = await supabase
        .from('tournaments')
        .select('*')
        .eq('judge_password', password);

    if (error) {
        console.error('Login error:', error);
        document.getElementById('login-error').classList.remove('hidden');
        return;
    }

    if (!data || data.length === 0) {
        document.getElementById('login-error').classList.remove('hidden');
        return;
    }

    currentTournament = data[0];
    document.getElementById('login-modal').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    document.getElementById('tournament-name').textContent = currentTournament.name;

    loadAthletes();
    loadWODs();
});

// Allow Enter key to login
document.getElementById('judge-password-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('judge-login-btn').click();
    }
});

// LOGOUT
document.getElementById('logout-btn').addEventListener('click', () => {
    currentTournament = null;
    document.getElementById('main-content').classList.add('hidden');
    document.getElementById('login-modal').classList.remove('hidden');
    document.getElementById('judge-password-input').value = '';
    document.getElementById('login-error').classList.add('hidden');
});

// LOAD ATHLETES
async function loadAthletes() {
    // Load registered participants for this tournament
    const { data, error } = await supabase
        .from('tournament_participants')
        .select(`
            *,
            athletes(id,first_name,last_name,gender)
        `)
        .eq('tournament_id', currentTournament.id)
        .order('athletes(last_name)');

    if (error) {
        console.error('Error loading participants:', error);
        return showStatus('Erreur lors du chargement des participants', true);
    }

    const participants = data || [];

    const select = document.getElementById('athlete-select');
    select.innerHTML = '<option value="">-- Sélectionner un participant --</option>';

    if (participants.length === 0) {
        select.innerHTML += '<option value="" disabled>Aucun participant inscrit</option>';
        return;
    }

    participants.forEach(p => {
        select.innerHTML += `<option value="${p.athletes.id}">${escapeHtml(p.athletes.first_name)} ${escapeHtml(p.athletes.last_name)} (${escapeHtml(p.level)} - ${escapeHtml(p.athletes.gender)})</option>`;
    });
}

// LOAD WODS
async function loadWODs() {
    const { data, error } = await supabase
        .from('workouts')
        .select('*')
        .eq('tournament_id', currentTournament.id)
        .order('wod_number');

    if (error) {
        console.error('Error loading WODs:', error);
        return showStatus('Erreur lors du chargement des WODs', true);
    }

    wods = data || [];

    const select = document.getElementById('wod-select');
    select.innerHTML = '<option value="">-- Sélectionner un WOD --</option>';
    wods.forEach(w => {
        select.innerHTML += `<option value="${w.id}">WOD ${w.wod_number} (${escapeHtml(w.wod_type)})</option>`;
    });
}

// Pre-fill form if athlete already has a result for the selected WOD
async function preloadExistingScore() {
    const athleteId = parseInt(document.getElementById('athlete-select').value);
    const wodId = parseInt(document.getElementById('wod-select').value);
    if (!athleteId || !wodId) return;

    const { data: existing } = await supabase
        .from('scores').select('*')
        .eq('workout_id', wodId)
        .eq('athlete_id', athleteId)
        .maybeSingle();

    if (!existing) return;

    const wod = wods.find(w => w.id === wodId);
    if (wod && wod.wod_type === 'time') {
        const isCompleted = existing.is_completed !== false;
        document.getElementById('result-is-completed').checked = isCompleted;
        if (isCompleted && existing.value_time) {
            document.getElementById('time-inputs-block').classList.remove('hidden');
            document.getElementById('timecap-reps-block').classList.add('hidden');
            document.getElementById('result-minutes').value = Math.floor(existing.value_time / 60);
            document.getElementById('result-seconds').value = existing.value_time % 60;
        } else if (!isCompleted) {
            document.getElementById('time-inputs-block').classList.add('hidden');
            document.getElementById('timecap-reps-block').classList.remove('hidden');
            document.getElementById('result-timecap-reps').value = existing.value_int || '';
        }
    } else {
        document.getElementById('result-value').value =
            existing.value_int ?? existing.value_decimal ?? '';
    }
    document.getElementById('result-notes').value = existing.notes || '';
    showStatus('Résultat existant chargé — modification en cours');
}

// WOD CHANGE
document.getElementById('wod-select').addEventListener('change', async (e) => {
    const wodId = parseInt(e.target.value);
    const regularInput = document.getElementById('result-regular');
    const timeInput = document.getElementById('result-time');
    const descriptionBlock = document.getElementById('wod-description');
    const descriptionText = document.getElementById('wod-description-text');
    const submitBtn = document.getElementById('submit-result-btn');

    if (!wodId) {
        regularInput.classList.add('hidden');
        timeInput.classList.add('hidden');
        descriptionBlock.classList.add('hidden');
        submitBtn.classList.add('hidden');
        return;
    }

    const wod = wods.find(w => w.id === wodId);

    // Show description
    if (wod && wod.description) {
        descriptionText.textContent = wod.description;
        descriptionBlock.classList.remove('hidden');
    } else {
        descriptionBlock.classList.add('hidden');
    }

    // Show appropriate input
    if (wod && wod.wod_type === 'time') {
        regularInput.classList.add('hidden');
        timeInput.classList.remove('hidden');
        // Reset timecap state
        document.getElementById('result-is-completed').checked = true;
        document.getElementById('time-inputs-block').classList.remove('hidden');
        document.getElementById('timecap-reps-block').classList.add('hidden');
    } else {
        regularInput.classList.remove('hidden');
        timeInput.classList.add('hidden');
    }

    submitBtn.classList.remove('hidden');

    // Pre-fill if existing result
    await preloadExistingScore();
});

// Pre-fill when athlete is selected and WOD already chosen
document.getElementById('athlete-select').addEventListener('change', async () => {
    await preloadExistingScore();
});

// Toggle timecap
document.getElementById('result-is-completed').addEventListener('change', (e) => {
    if (e.target.checked) {
        document.getElementById('time-inputs-block').classList.remove('hidden');
        document.getElementById('timecap-reps-block').classList.add('hidden');
    } else {
        document.getElementById('time-inputs-block').classList.add('hidden');
        document.getElementById('timecap-reps-block').classList.remove('hidden');
    }
});

// Seconds validation
document.getElementById('result-seconds').addEventListener('input', (e) => {
    let value = parseInt(e.target.value);
    if (value > 59) {
        e.target.value = 59;
        showStatus('Secondes: maximum 59', true);
    }
    if (value < 0) {
        e.target.value = 0;
    }
});

// SUBMIT RESULT
document.getElementById('submit-result-btn').addEventListener('click', async () => {
    const athleteId = parseInt(document.getElementById('athlete-select').value);
    const wodId = parseInt(document.getElementById('wod-select').value);

    if (!athleteId || !wodId) {
        return alert('Veuillez sélectionner un participant et un WOD');
    }

    const wod = wods.find(w => w.id === wodId);
    const isTimeWod = wod && wod.wod_type === 'time';

    // Prepare result data
    let resultData = {
        workout_id: wodId,
        athlete_id: athleteId
    };

    if (isTimeWod) {
        const isCompleted = document.getElementById('result-is-completed').checked;
        resultData.is_completed = isCompleted;

        if (isCompleted) {
            const minutes = parseInt(document.getElementById('result-minutes').value) || 0;
            const seconds = parseInt(document.getElementById('result-seconds').value) || 0;
            if (minutes === 0 && seconds === 0) return alert('Veuillez entrer un temps');
            if (seconds > 59) return alert('Les secondes doivent être entre 0 et 59');
            resultData.value_time = minutes * 60 + seconds;
        } else {
            // Time cap — save reps as value_int
            const reps = parseInt(document.getElementById('result-timecap-reps').value) || 0;
            if (reps === 0) return alert('Veuillez entrer le nombre de répétitions au time cap');
            resultData.value_int = reps;
        }
    } else {
        const value = document.getElementById('result-value').value.trim();

        if (!value) {
            return alert('⚠️ Veuillez entrer un résultat');
        }

        const numValue = parseFloat(value);
        if (!isNaN(numValue)) {
            if (Number.isInteger(numValue)) {
                resultData.value_int = numValue;
            } else {
                resultData.value_decimal = numValue;
            }
        } else {
            resultData.notes = value;
        }
    }

    // Check if result already exists
    const { data: existing } = await supabase
        .from('scores')
        .select('id')
        .eq('workout_id', wodId)
        .eq('athlete_id', athleteId)
        .maybeSingle();

    if (existing) {
        // Update existing result
        const { error } = await supabase
            .from('scores')
            .update(resultData)
            .eq('id', existing.id);

        if (error) {
            console.error('Error updating result:', error);
            return showStatus('Erreur lors de la mise à jour', true);
        }

        showStatus('Résultat mis à jour avec succès!');
    } else {
        // Insert new result
        const { error } = await supabase.from('scores').insert(resultData);

        if (error) {
            console.error('Error saving result:', error);
            return showStatus('Erreur lors de la sauvegarde', true);
        }

        showStatus('Résultat enregistré avec succès!');
    }

    // Reset form
    document.getElementById('result-value').value = '';
    document.getElementById('result-minutes').value = '';
    document.getElementById('result-seconds').value = '';
    document.getElementById('result-timecap-reps').value = '';
    document.getElementById('result-is-completed').checked = true;
    document.getElementById('time-inputs-block').classList.remove('hidden');
    document.getElementById('timecap-reps-block').classList.add('hidden');
    document.getElementById('athlete-select').value = '';
    document.getElementById('wod-select').value = '';
    document.getElementById('result-regular').classList.add('hidden');
    document.getElementById('result-time').classList.add('hidden');
    document.getElementById('wod-description').classList.add('hidden');
    document.getElementById('submit-result-btn').classList.add('hidden');
});
</script>

</body>
</html>
