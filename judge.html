<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juge - CrossFit Competition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50">

<!-- LOGIN MODAL -->
<div id="login-modal" class="fixed inset-0 bg-gray-100 flex items-center justify-center">
    <div class="bg-white rounded-lg shadow-lg p-8 max-w-md w-full mx-4">
        <h1 class="text-3xl font-bold mb-2 text-center">⚖️ Accès Juge</h1>
        <p class="text-gray-600 mb-6 text-center">Entrez le mot de passe du tournoi</p>

        <input type="password" id="judge-password-input"
               class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 mb-4 text-center text-lg"
               placeholder="Mot de passe">

        <button id="judge-login-btn"
                class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 text-lg">
            Connexion
        </button>

        <p id="login-error" class="text-red-600 text-sm mt-3 text-center hidden">❌ Mot de passe incorrect</p>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content" class="hidden min-h-screen pb-8">
    <header class="bg-white shadow-sm mb-6">
        <div class="max-w-4xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold">⚖️ Interface Juge</h1>
                    <p id="tournament-name" class="text-gray-600"></p>
                </div>
                <button id="logout-btn" class="text-sm text-gray-600 hover:text-gray-800">Déconnexion</button>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4">
        <!-- RESULT ENTRY FORM -->
        <div class="bg-white rounded-lg shadow-sm p-6">
            <h2 class="text-xl font-bold mb-4">📝 Saisie de résultat</h2>

            <div class="space-y-4">
                <!-- Athlete Selection -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Participant</label>
                    <select id="athlete-select" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3">
                        <option value="">-- Sélectionner --</option>
                    </select>
                </div>

                <!-- WOD Selection -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">WOD</label>
                    <select id="wod-select" class="w-full border-2 border-gray-300 rounded-lg px-4 py-3">
                        <option value="">-- Sélectionner --</option>
                    </select>
                </div>

                <!-- Regular Result Input (for reps, weight, complex) -->
                <div id="result-regular" class="hidden">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Résultat</label>
                    <input type="text" id="result-value"
                           placeholder="Ex: 150, 85kg"
                           class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-lg">
                </div>

                <!-- Time Result Input (for time-based WODs) -->
                <div id="result-time" class="hidden">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">⏱️ Temps (For Time)</label>
                    <div class="flex gap-3 items-center">
                        <div class="flex-1">
                            <input type="number" id="result-minutes" min="0" max="999" placeholder="00"
                                   class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-center text-2xl font-mono">
                            <p class="text-xs text-gray-500 text-center mt-1">minutes</p>
                        </div>
                        <span class="text-3xl font-bold text-gray-400 pb-6">:</span>
                        <div class="flex-1">
                            <input type="number" id="result-seconds" min="0" max="59" placeholder="00"
                                   class="w-full border-2 border-gray-300 rounded-lg px-4 py-3 text-center text-2xl font-mono">
                            <p class="text-xs text-gray-500 text-center mt-1">secondes</p>
                        </div>
                    </div>
                    <p class="text-xs text-gray-500 mt-2">💡 Exemple: 12 minutes 34 secondes = 12:34</p>
                </div>

                <!-- Submit Button -->
                <button id="submit-result-btn"
                        class="w-full bg-green-600 text-white py-4 rounded-lg font-bold text-lg hover:bg-green-700">
                    ✅ Enregistrer le résultat
                </button>
            </div>
        </div>

        <!-- Recent Results -->
        <div class="bg-white rounded-lg shadow-sm p-6 mt-6">
            <h2 class="text-xl font-bold mb-4">📋 Résultats récents</h2>
            <div id="recent-results" class="space-y-2"></div>
        </div>
    </div>
</div>

<script>
// SUPABASE CONFIG
const SUPABASE_URL = 'https://nczkbyaowkkkohemakva.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5jemtieWFvd2tra29oZW1ha3ZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzcxMTI1NDQsImV4cCI6MjA1MjY4ODU0NH0.YRVo26qWrTugb8C_c6I56EjcQujsaWQ6JXUBcHPP62I';
var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// STATE
let currentTournament = null;
let athletes = [];
let wods = [];
let teams = [];

// UTILITY
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showStatus(msg, duration = 3000) {
    const existing = document.getElementById('status-message');
    if (existing) existing.remove();

    const div = document.createElement('div');
    div.id = 'status-message';
    div.className = 'fixed top-4 right-4 bg-green-600 text-white px-6 py-3 rounded-lg shadow-lg z-50';
    div.textContent = msg;
    document.body.appendChild(div);

    setTimeout(() => div.remove(), duration);
}

// LOGIN
document.getElementById('judge-login-btn').addEventListener('click', async () => {
    const password = document.getElementById('judge-password-input').value.trim();

    if (!password) {
        return alert('⚠️ Veuillez entrer un mot de passe');
    }

    // Find tournament by judge password
    const { data, error } = await supabase
        .from('tournaments')
        .select('*')
        .eq('judge_password', password)
        .single();

    if (error || !data) {
        document.getElementById('login-error').classList.remove('hidden');
        return;
    }

    currentTournament = data;
    document.getElementById('login-modal').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    document.getElementById('tournament-name').textContent = `Tournoi: ${escapeHtml(data.name)}`;

    await loadData();
});

// LOGOUT
document.getElementById('logout-btn').addEventListener('click', () => {
    currentTournament = null;
    document.getElementById('main-content').classList.add('hidden');
    document.getElementById('login-modal').classList.remove('hidden');
    document.getElementById('judge-password-input').value = '';
    document.getElementById('login-error').classList.add('hidden');
});

// LOAD DATA
async function loadData() {
    // Load athletes (or teams if team tournament)
    if (currentTournament.competition_type === 'team') {
        const { data } = await supabase
            .from('teams')
            .select('*, athlete1:athletes!teams_athlete1_id_fkey(first_name,last_name), athlete2:athletes!teams_athlete2_id_fkey(first_name,last_name)')
            .eq('tournament_id', currentTournament.id)
            .order('id');

        teams = data || [];

        const select = document.getElementById('athlete-select');
        select.innerHTML = '<option value="">-- Sélectionner une équipe --</option>';
        teams.forEach(t => {
            const name = t.team_name || `${t.athlete1.first_name} ${t.athlete1.last_name} & ${t.athlete2.first_name} ${t.athlete2.last_name}`;
            select.innerHTML += `<option value="team-${t.id}">${escapeHtml(name)}</option>`;
        });
    } else {
        const { data } = await supabase
            .from('athletes')
            .select('*')
            .order('last_name');

        athletes = data || [];

        const select = document.getElementById('athlete-select');
        select.innerHTML = '<option value="">-- Sélectionner un athlète --</option>';
        athletes.forEach(a => {
            select.innerHTML += `<option value="${a.id}">${escapeHtml(a.first_name)} ${escapeHtml(a.last_name)} (${escapeHtml(a.category)} - ${escapeHtml(a.gender)})</option>`;
        });
    }

    // Load WODs for this tournament
    const { data: wodData } = await supabase
        .from('workouts')
        .select('*')
        .eq('tournament_id', currentTournament.id)
        .order('wod_number');

    wods = wodData || [];

    const wodSelect = document.getElementById('wod-select');
    wodSelect.innerHTML = '<option value="">-- Sélectionner un WOD --</option>';
    wods.forEach(w => {
        wodSelect.innerHTML += `<option value="${w.id}">WOD ${w.wod_number} (${escapeHtml(w.wod_type)})</option>`;
    });

    loadRecentResults();
}

// Update result input type based on WOD
document.getElementById('wod-select').addEventListener('change', (e) => {
    const wodId = parseInt(e.target.value);
    const regularInput = document.getElementById('result-regular');
    const timeInput = document.getElementById('result-time');

    if (!wodId) {
        regularInput.classList.add('hidden');
        timeInput.classList.add('hidden');
        return;
    }

    const wod = wods.find(w => w.id === wodId);

    if (wod && wod.wod_type === 'time') {
        regularInput.classList.add('hidden');
        timeInput.classList.remove('hidden');
    } else {
        regularInput.classList.remove('hidden');
        timeInput.classList.add('hidden');
    }
});

// Seconds validation
document.getElementById('result-seconds').addEventListener('input', (e) => {
    let value = parseInt(e.target.value);
    if (value > 59) {
        e.target.value = 59;
        showStatus('⚠️ Secondes: maximum 59', 2000);
    }
    if (value < 0) {
        e.target.value = 0;
    }
});

// SUBMIT RESULT
document.getElementById('submit-result-btn').addEventListener('click', async () => {
    const athleteValue = document.getElementById('athlete-select').value;
    const wodId = parseInt(document.getElementById('wod-select').value);

    if (!athleteValue) {
        return alert('⚠️ Veuillez sélectionner un participant');
    }
    if (!wodId) {
        return alert('⚠️ Veuillez sélectionner un WOD');
    }

    const wod = wods.find(w => w.id === wodId);
    const isTimeWod = wod && wod.wod_type === 'time';

    let athleteId = null;
    let teamId = null;

    if (athleteValue.startsWith('team-')) {
        teamId = parseInt(athleteValue.replace('team-', ''));
    } else {
        athleteId = parseInt(athleteValue);
    }

    // Prepare result data
    let resultData = {
        workout_id: wodId,
        athlete_id: athleteId,
        team_id: teamId
    };

    if (isTimeWod) {
        const minutes = parseInt(document.getElementById('result-minutes').value) || 0;
        const seconds = parseInt(document.getElementById('result-seconds').value) || 0;

        if (minutes === 0 && seconds === 0) {
            return alert('⚠️ Veuillez entrer un temps (minutes et secondes)');
        }
        if (seconds > 59) {
            return alert('⚠️ Les secondes doivent être entre 0 et 59');
        }

        resultData.value_time = minutes * 60 + seconds;
    } else {
        const value = document.getElementById('result-value').value.trim();

        if (!value) {
            return alert('⚠️ Veuillez entrer un résultat');
        }

        // Try to parse as number
        const numValue = parseFloat(value);
        if (!isNaN(numValue)) {
            if (Number.isInteger(numValue)) {
                resultData.value_int = numValue;
            } else {
                resultData.value_decimal = numValue;
            }
        } else {
            resultData.notes = value;
        }
    }

    // Save to database
    const { error } = await supabase.from('scores').insert(resultData);

    if (error) {
        console.error('Error saving result:', error);
        return alert('❌ Erreur lors de la sauvegarde');
    }

    showStatus('✅ Résultat enregistré');

    // Clear form
    document.getElementById('result-value').value = '';
    document.getElementById('result-minutes').value = '';
    document.getElementById('result-seconds').value = '';
    document.getElementById('athlete-select').value = '';
    document.getElementById('wod-select').value = '';
    document.getElementById('result-regular').classList.add('hidden');
    document.getElementById('result-time').classList.add('hidden');

    await loadRecentResults();
});

// LOAD RECENT RESULTS
async function loadRecentResults() {
    let query = supabase
        .from('scores')
        .select(`
            id,
            value_int,
            value_decimal,
            value_time,
            notes,
            created_at,
            athletes(first_name, last_name),
            teams(id, team_name, athlete1:athletes!teams_athlete1_id_fkey(first_name,last_name), athlete2:athletes!teams_athlete2_id_fkey(first_name,last_name)),
            workouts(wod_number, wod_type, tournament_id)
        `)
        .eq('workouts.tournament_id', currentTournament.id)
        .order('created_at', { ascending: false })
        .limit(10);

    const { data } = await query;

    const container = document.getElementById('recent-results');

    if (!data || data.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-sm">Aucun résultat pour l\'instant</p>';
        return;
    }

    container.innerHTML = data.map(s => {
        let participantName;
        if (s.teams) {
            participantName = s.teams.team_name || `${s.teams.athlete1.first_name} ${s.teams.athlete1.last_name} & ${s.teams.athlete2.first_name} ${s.teams.athlete2.last_name}`;
        } else if (s.athletes) {
            participantName = `${s.athletes.first_name} ${s.athletes.last_name}`;
        } else {
            participantName = 'Inconnu';
        }

        let result;
        if (s.value_time) {
            const minutes = Math.floor(s.value_time / 60);
            const seconds = s.value_time % 60;
            result = `${minutes}:${seconds.toString().padStart(2, '0')}`;
        } else if (s.value_int !== null) {
            result = String(s.value_int);
        } else if (s.value_decimal !== null) {
            result = String(s.value_decimal);
        } else {
            result = s.notes || '-';
        }

        const time = new Date(s.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

        return `
            <div class="flex justify-between items-center py-2 border-b">
                <div>
                    <span class="font-semibold">${escapeHtml(participantName)}</span>
                    <span class="text-gray-600 text-sm">- WOD ${s.workouts.wod_number}</span>
                </div>
                <div class="text-right">
                    <div class="font-bold text-blue-600">${escapeHtml(result)}</div>
                    <div class="text-xs text-gray-500">${time}</div>
                </div>
            </div>
        `;
    }).join('');
}

// Allow Enter key to login
document.getElementById('judge-password-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('judge-login-btn').click();
    }
});
</script>

</body>
</html>
