<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrée Juge - CrossFit Competition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900">

<!-- LOGIN MODAL -->
<div id="login-modal" class="fixed inset-0 bg-gray-900 flex items-center justify-center z-50">
    <div class="bg-gray-800 rounded-lg shadow-2xl p-8 max-w-md w-full mx-4 border border-gray-700">
        <h1 class="text-3xl font-bold mb-2 text-center text-white">Accès Juge</h1>
        <p class="text-gray-300 mb-6 text-center">Entrez le mot de passe du tournoi</p>

        <input type="password" id="judge-password-input"
               class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 mb-4 text-center text-xl placeholder-gray-400"
               placeholder="Mot de passe">

        <button id="judge-login-btn"
                class="w-full bg-red-600 text-white py-4 rounded-lg font-bold hover:bg-red-700 text-xl transition-colors">
            Connexion
        </button>

        <p id="login-error" class="text-red-400 text-sm mt-3 text-center hidden">Mot de passe incorrect</p>

        <a href="index.html" class="block text-center text-gray-400 hover:text-gray-200 mt-6 text-sm">
            ← Retour à l'accueil
        </a>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="main-content" class="hidden min-h-screen pb-8">
    <header class="bg-gray-800 shadow-lg mb-6">
        <div class="max-w-4xl mx-auto px-4 py-6">
            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 mb-3">
                <div>
                    <h1 class="text-2xl sm:text-3xl font-bold text-white">Interface Juge</h1>
                    <p id="tournament-name" class="text-gray-300 text-lg mt-1"></p>
                </div>
                <div class="flex gap-3 flex-shrink-0">
                    <a id="leaderboard-link" href="leaderboard.html" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-semibold">
                        Résultats
                    </a>
                    <button id="logout-btn" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg font-semibold">
                        🚪 Exit
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="max-w-4xl mx-auto px-4">
        <!-- RESULT ENTRY FORM -->
        <div class="bg-gray-800 rounded-lg shadow-xl p-8">
            <h2 class="text-2xl font-bold mb-6 text-white">Saisie de résultat</h2>

            <div class="space-y-6">
                <!-- Athlete Selection -->
                <div>
                    <label class="block text-base font-semibold text-gray-200 mb-3">Participant</label>
                    <select id="athlete-select" class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-lg">
                        <option value="">-- Sélectionner un participant --</option>
                    </select>
                </div>

                <!-- OPEN Division Selection -->
                <div id="open-division-container" class="hidden">
                    <label class="block text-base font-semibold text-gray-200 mb-3">Division pour ce WOD</label>
                    <div id="division-buttons-grid" class="grid grid-cols-3 gap-3">
                        <!-- Buttons will be generated dynamically based on active_divisions -->
                    </div>
                    <input type="hidden" id="selected-division" value="">
                </div>

                <!-- WOD Selection -->
                <div>
                    <label class="block text-base font-semibold text-gray-200 mb-3">WOD</label>
                    <select id="wod-select" class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-lg">
                        <option value="">-- Sélectionner un WOD --</option>
                    </select>
                </div>

                <!-- WOD Description -->
                <div id="wod-description" class="hidden bg-gradient-to-r from-gray-700 to-gray-600 border-2 border-red-600 p-6 rounded-lg shadow-lg">
                    <h3 class="font-bold text-white mb-4 text-xl">
                        Description du WOD
                    </h3>
                    <p id="wod-description-text" class="text-lg text-gray-100 whitespace-pre-wrap font-medium leading-relaxed"></p>
                </div>

                <!-- Regular Result Input -->
                <div id="result-regular" class="hidden">
                    <label class="block text-base font-semibold text-gray-200 mb-3">Résultat</label>
                    <input type="text" id="result-value"
                           placeholder="Ex: 150, 85kg"
                           class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-xl placeholder-gray-400">
                </div>

                <!-- Time Result Input -->
                <div id="result-time" class="hidden">
                    <!-- Toggle: WOD Terminé / Pas Terminé -->
                    <div class="mb-5">
                        <div class="grid grid-cols-2 rounded-xl overflow-hidden border-2 border-gray-600">
                            <button type="button" id="toggle-completed-btn"
                                    class="py-4 font-bold text-lg bg-green-700 text-white transition-all"
                                    onclick="setWodCompleted(true)">
                                ✓ WOD terminé
                            </button>
                            <button type="button" id="toggle-not-completed-btn"
                                    class="py-4 font-bold text-lg bg-gray-700 text-gray-400 transition-all"
                                    onclick="setWodCompleted(false)">
                                ✗ Pas terminé
                            </button>
                        </div>
                        <input type="checkbox" id="result-is-completed" checked class="sr-only">
                    </div>

                    <!-- Time inputs (when completed) -->
                    <div id="time-inputs-block">
                        <div class="flex gap-4 items-center">
                            <div class="flex-1">
                                <input type="number" id="result-minutes" min="0" max="999" placeholder="00"
                                       class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-center text-3xl font-mono">
                                <p class="text-sm text-gray-300 text-center mt-2">minutes</p>
                            </div>
                            <span class="text-4xl font-bold text-gray-400 pb-8">:</span>
                            <div class="flex-1">
                                <input type="number" id="result-seconds" min="0" max="59" placeholder="00"
                                       class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-center text-3xl font-mono">
                                <p class="text-sm text-gray-300 text-center mt-2">secondes</p>
                            </div>
                        </div>
                        <p id="timecap-hint" class="hidden text-sm text-amber-400 mt-3 font-semibold"></p>
                    </div>

                    <!-- Reps (when NOT completed) -->
                    <div id="timecap-reps-block" class="hidden">
                        <label class="block text-base font-semibold text-gray-200 mb-3">Nombre des Rep's</label>
                        <input type="number" id="result-timecap-reps" min="0" placeholder="0"
                               class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-xl text-center font-mono">

                        <label class="block text-base font-semibold text-gray-200 mb-3 mt-5">Tiebreak (temps au moment des reps)</label>
                        <div class="flex gap-4 items-center">
                            <div class="flex-1">
                                <input type="number" id="tiebreak-minutes" min="0" max="999" placeholder="00"
                                       class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-center text-3xl font-mono">
                                <p class="text-sm text-gray-300 text-center mt-2">minutes</p>
                            </div>
                            <span class="text-4xl font-bold text-gray-400 pb-8">:</span>
                            <div class="flex-1">
                                <input type="number" id="tiebreak-seconds" min="0" max="59" placeholder="00"
                                       class="w-full bg-gray-700 border-2 border-gray-600 text-white rounded-lg px-5 py-4 text-center text-3xl font-mono">
                                <p class="text-sm text-gray-300 text-center mt-2">secondes</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button id="submit-result-btn"
                        class="w-full bg-red-600 text-white py-5 rounded-lg font-bold text-xl hover:bg-red-700 transition-colors shadow-lg hidden">
                    Enregistrer le résultat
                </button>
                <!-- Delete Button (only when editing existing result) -->
                <button id="delete-result-btn"
                        class="w-full bg-gray-700 border-2 border-red-800 text-red-400 py-3 rounded-lg font-semibold text-base hover:bg-red-900 hover:text-red-200 transition-colors hidden">
                    🗑 Supprimer ce résultat
                </button>
            </div>
        </div>
    </div>
</div>

<script>
// SUPABASE CONFIG
const SUPABASE_URL = 'https://gbdanipvnqrggjjoebtn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdiZGFuaXB2bnFyZ2dqam9lYnRuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUzNjYyNzUsImV4cCI6MjA4MDk0MjI3NX0.cRSuKatOSWgcbyhqAJ_5oWnENZK5sQZaZiGL15uytME';
var supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// MAINTENANCE MODE CHECK
// Check if maintenance mode is enabled and redirect if necessary
(async function checkMaintenanceMode() {
    try {
        const { data, error } = await supabase
            .from('app_settings')
            .select('value')
            .eq('key', 'maintenance_mode')
            .maybeSingle();

        // Fail-open: if error or no data, don't redirect
        if (error || !data) {
            console.log('ℹ️ Maintenance mode check: no restriction');
            return;
        }

        // Redirect to maintenance page if enabled
        if (data.value === 'true') {
            console.log('🔧 Maintenance mode enabled, redirecting...');
            window.location.href = 'maintenance.html';
        }
    } catch (err) {
        // Fail-open: if check fails, allow access
        console.warn('⚠️ Maintenance mode check failed, allowing access:', err);
    }
})();

// STATE
let currentTournament = null;
let athletes = [];
let wods = [];
let existingScoreId = null;
let currentWodTimeCap = null;

// UTILITY
function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showStatus(msg, isError = false) {
    const existing = document.getElementById('status-message');
    if (existing) existing.remove();

    const div = document.createElement('div');
    div.id = 'status-message';
    div.className = `fixed top-4 right-4 ${isError ? 'bg-red-600' : 'bg-green-600'} text-white px-6 py-3 rounded-lg shadow-lg z-50`;
    div.textContent = msg;
    document.body.appendChild(div);

    setTimeout(() => div.remove(), 4000);
}

// Create division buttons based on tournament's active_divisions
function createDivisionButtons() {
    const container = document.getElementById('division-buttons-grid');
    if (!container) return;

    // Get active divisions from tournament or use defaults
    const activeDivisions = currentTournament && currentTournament.active_divisions && currentTournament.active_divisions.length > 0
        ? currentTournament.active_divisions
        : ['rx', 'scaled', 'foundations'];

    // Division config: label, subtitle, color
    const divisionConfig = {
        'elite': { label: 'Elite', subtitle: 'Élite', color: 'red' },
        'rx': { label: 'RX', subtitle: 'Élite', color: 'orange' },
        'intermediaire': { label: 'Inter', subtitle: 'Intermédiaire', color: 'purple' },
        'inter': { label: 'Inter', subtitle: 'Intermédiaire', color: 'purple' },
        'scaled': { label: 'Scaled', subtitle: 'Intermédiaire', color: 'blue' },
        'scale': { label: 'Scaled', subtitle: 'Intermédiaire', color: 'blue' },
        'foundations': { label: 'Found.', subtitle: 'Débutant', color: 'green' }
    };

    // Adjust grid columns based on number of divisions
    const colsClass = activeDivisions.length === 5 ? 'grid-cols-5' :
                      activeDivisions.length === 4 ? 'grid-cols-4' :
                      activeDivisions.length === 2 ? 'grid-cols-2' :
                      'grid-cols-3';
    container.className = `grid ${colsClass} gap-3`;

    // Generate buttons
    container.innerHTML = activeDivisions.map(div => {
        const config = divisionConfig[div.toLowerCase()] || { label: div, subtitle: '', color: 'gray' };
        return `
            <button type="button" class="division-btn border-2 border-gray-600 bg-gray-700 rounded-lg py-3 text-center font-bold transition-all hover:border-gray-400" data-value="${div.toLowerCase()}">
                <div class="text-gray-100">${config.label}</div>
                ${config.subtitle ? `<div class="text-xs text-gray-400 mt-1">${config.subtitle}</div>` : ''}
            </button>
        `;
    }).join('');

    // Attach event listeners to new buttons
    container.querySelectorAll('.division-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            container.querySelectorAll('.division-btn').forEach(b => {
                b.classList.remove('border-blue-500', 'bg-blue-900');
                b.classList.add('border-gray-600', 'bg-gray-700');
            });
            btn.classList.remove('border-gray-600', 'bg-gray-700');
            btn.classList.add('border-blue-500', 'bg-blue-900');
            document.getElementById('selected-division').value = btn.dataset.value;
        });
    });
}

// LOGIN
document.getElementById('judge-login-btn').addEventListener('click', async () => {
    const password = document.getElementById('judge-password-input').value.trim();

    if (!password) {
        return alert('Veuillez entrer un mot de passe');
    }

    // Find tournament by judge password
    const { data, error } = await supabase
        .from('tournaments')
        .select('*')
        .eq('judge_password', password);

    if (error) {
        console.error('Login error:', error);
        document.getElementById('login-error').classList.remove('hidden');
        return;
    }

    if (!data || data.length === 0) {
        document.getElementById('login-error').classList.remove('hidden');
        return;
    }

    currentTournament = data[0];
    document.getElementById('login-modal').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');
    document.getElementById('tournament-name').textContent = currentTournament.name;

    // Update leaderboard link to include current tournament
    document.getElementById('leaderboard-link').href = `leaderboard.html?tournament=${currentTournament.id}`;

    if (currentTournament.is_open) {
        document.getElementById('open-division-container').classList.remove('hidden');
        createDivisionButtons(); // Generate division buttons based on active_divisions
    } else {
        document.getElementById('open-division-container').classList.add('hidden');
    }

    loadAthletes();
    loadWODs();
});

// Allow Enter key to login
document.getElementById('judge-password-input').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
        document.getElementById('judge-login-btn').click();
    }
});

// LOGOUT
document.getElementById('logout-btn').addEventListener('click', () => {
    currentTournament = null;
    document.getElementById('main-content').classList.add('hidden');
    document.getElementById('login-modal').classList.remove('hidden');
    document.getElementById('judge-password-input').value = '';
    document.getElementById('login-error').classList.add('hidden');
});

// LOAD ATHLETES
async function loadAthletes() {
    // Load registered participants for this tournament
    const { data, error } = await supabase
        .from('tournament_participants')
        .select(`
            *,
            athletes(id,first_name,last_name,gender)
        `)
        .eq('tournament_id', currentTournament.id)
        .order('athletes(last_name)');

    if (error) {
        console.error('Error loading participants:', error);
        return showStatus('Erreur lors du chargement des participants', true);
    }

    const participants = data || [];

    const select = document.getElementById('athlete-select');
    select.innerHTML = '<option value="">-- Sélectionner un participant --</option>';

    if (participants.length === 0) {
        select.innerHTML += '<option value="" disabled>Aucun participant inscrit</option>';
        return;
    }

    participants.forEach(p => {
        select.innerHTML += `<option value="${p.athletes.id}">${escapeHtml(p.athletes.first_name)} ${escapeHtml(p.athletes.last_name)}</option>`;
    });
}

// LOAD WODS
async function loadWODs() {
    const { data, error } = await supabase
        .from('workouts')
        .select('*')
        .eq('tournament_id', currentTournament.id)
        .order('wod_number');

    if (error) {
        console.error('Error loading WODs:', error);
        return showStatus('Erreur lors du chargement des WODs', true);
    }

    wods = data || [];

    const select = document.getElementById('wod-select');
    select.innerHTML = '<option value="">-- Sélectionner un WOD --</option>';
    wods.forEach(w => {
        select.innerHTML += `<option value="${w.id}">WOD ${w.wod_number} (${escapeHtml(w.wod_type)})</option>`;
    });
}

// Pre-fill form if athlete already has a result for the selected WOD
async function preloadExistingScore() {
    const athleteId = parseInt(document.getElementById('athlete-select').value);
    const wodId = parseInt(document.getElementById('wod-select').value);
    if (!athleteId || !wodId) return;

    const { data: existing } = await supabase
        .from('scores').select('*')
        .eq('workout_id', wodId)
        .eq('athlete_id', athleteId)
        .maybeSingle();

    if (!existing) {
        existingScoreId = null;
        document.getElementById('delete-result-btn').classList.add('hidden');
        // Clear fields so previous athlete's data doesn't linger
        document.getElementById('result-value').value = '';
        document.getElementById('result-minutes').value = '';
        document.getElementById('result-seconds').value = '';
        document.getElementById('result-timecap-reps').value = '';
    document.getElementById('tiebreak-minutes').value = '';
    document.getElementById('tiebreak-seconds').value = '';
        setWodCompleted(true);
        resetDivisionButtons();
        return;
    }

    existingScoreId = existing.id;
    document.getElementById('delete-result-btn').classList.remove('hidden');

    const wod = wods.find(w => w.id === wodId);
    if (wod && wod.wod_type === 'time') {
        const isCompleted = existing.is_completed !== false;
        setWodCompleted(isCompleted);
        if (isCompleted && existing.value_time) {
            document.getElementById('result-minutes').value = Math.floor(existing.value_time / 60);
            document.getElementById('result-seconds').value = existing.value_time % 60;
        } else if (!isCompleted) {
            document.getElementById('result-timecap-reps').value = existing.value_int || '';
            if (existing.tiebreak_time) {
                document.getElementById('tiebreak-minutes').value = Math.floor(existing.tiebreak_time / 60);
                document.getElementById('tiebreak-seconds').value = existing.tiebreak_time % 60;
            }
        }
    } else {
        document.getElementById('result-value').value =
            existing.value_int ?? existing.value_decimal ?? '';
    }
    if (existing.division) {
        highlightDivisionButton(existing.division);
    }
    showStatus('Résultat existant chargé — modification en cours');
}

// WOD CHANGE
document.getElementById('wod-select').addEventListener('change', async (e) => {
    const wodId = parseInt(e.target.value);
    const regularInput = document.getElementById('result-regular');
    const timeInput = document.getElementById('result-time');
    const descriptionBlock = document.getElementById('wod-description');
    const descriptionText = document.getElementById('wod-description-text');
    const submitBtn = document.getElementById('submit-result-btn');

    if (!wodId) {
        regularInput.classList.add('hidden');
        timeInput.classList.add('hidden');
        descriptionBlock.classList.add('hidden');
        submitBtn.classList.add('hidden');
        return;
    }

    const wod = wods.find(w => w.id === wodId);

    // Show description
    if (wod && wod.description) {
        descriptionText.textContent = wod.description;
        descriptionBlock.classList.remove('hidden');
    } else {
        descriptionBlock.classList.add('hidden');
    }

    // Show appropriate input
    if (wod && wod.wod_type === 'time') {
        regularInput.classList.add('hidden');
        timeInput.classList.remove('hidden');
        // Reset timecap state
        setWodCompleted(true);
        // Show time cap limit if set
        const timecapHint = document.getElementById('timecap-hint');
        if (wod.time_cap) {
            currentWodTimeCap = wod.time_cap;
            document.getElementById('result-minutes').max = wod.time_cap;
            timecapHint.textContent = `⏱️ Time cap: ${wod.time_cap} min — max résultat complété ${wod.time_cap}:00`;
            timecapHint.classList.remove('hidden');
        } else {
            currentWodTimeCap = null;
            document.getElementById('result-minutes').max = 999;
            timecapHint.classList.add('hidden');
        }
    } else {
        regularInput.classList.remove('hidden');
        timeInput.classList.add('hidden');
    }

    submitBtn.classList.remove('hidden');

    // Pre-fill if existing result
    await preloadExistingScore();
});

// Pre-fill when athlete is selected and WOD already chosen
document.getElementById('athlete-select').addEventListener('change', async () => {
    await preloadExistingScore();
});

// Division button selection is now handled in createDivisionButtons() function

// Helper functions for division buttons
function resetDivisionButtons() {
    document.querySelectorAll('.division-btn').forEach(b => {
        b.classList.remove('border-blue-500', 'bg-blue-900');
        b.classList.add('border-gray-600', 'bg-gray-700');
    });
    document.getElementById('selected-division').value = '';
}

function highlightDivisionButton(divisionValue) {
    resetDivisionButtons();
    document.querySelectorAll('.division-btn').forEach(b => {
        if (b.dataset.value === divisionValue) {
            b.classList.remove('border-gray-600', 'bg-gray-700');
            b.classList.add('border-blue-500', 'bg-blue-900');
        }
    });
    document.getElementById('selected-division').value = divisionValue;
}

// Toggle completed/not completed
function setWodCompleted(completed) {
    document.getElementById('result-is-completed').checked = completed;
    const btnDone = document.getElementById('toggle-completed-btn');
    const btnNot = document.getElementById('toggle-not-completed-btn');
    if (completed) {
        btnDone.className = 'py-4 font-bold text-lg bg-green-700 text-white transition-all';
        btnNot.className = 'py-4 font-bold text-lg bg-gray-700 text-gray-400 transition-all';
        document.getElementById('time-inputs-block').classList.remove('hidden');
        document.getElementById('timecap-reps-block').classList.add('hidden');
    } else {
        btnDone.className = 'py-4 font-bold text-lg bg-gray-700 text-gray-400 transition-all';
        btnNot.className = 'py-4 font-bold text-lg bg-red-700 text-white transition-all';
        document.getElementById('time-inputs-block').classList.add('hidden');
        document.getElementById('timecap-reps-block').classList.remove('hidden');
    }
}

// Seconds validation
document.getElementById('result-seconds').addEventListener('input', (e) => {
    let value = parseInt(e.target.value);
    if (value < 0) { e.target.value = 0; return; }
    if (value > 59) {
        e.target.value = 59;
        showStatus('Secondes: maximum 59', true);
        return;
    }
    // If at time cap minutes, seconds must be 0
    const minutes = parseInt(document.getElementById('result-minutes').value) || 0;
    if (currentWodTimeCap && minutes >= currentWodTimeCap && value > 0) {
        e.target.value = 0;
        showStatus(`⏱️ Limite time cap: ${currentWodTimeCap}:00`, true);
    }
});

// Tiebreak seconds validation
document.getElementById('tiebreak-seconds').addEventListener('input', (e) => {
    let value = parseInt(e.target.value);
    if (value < 0) { e.target.value = 0; return; }
    if (value > 59) {
        e.target.value = 59;
        showStatus('Secondes: maximum 59', true);
        return;
    }
});

// Minutes validation (time cap)
document.getElementById('result-minutes').addEventListener('input', (e) => {
    let value = parseInt(e.target.value);
    if (value < 0) { e.target.value = 0; return; }
    if (currentWodTimeCap && value > currentWodTimeCap) {
        e.target.value = currentWodTimeCap;
        // Also reset seconds to 0 since we're at the cap limit
        document.getElementById('result-seconds').value = 0;
        showStatus(`⏱️ Limite time cap: ${currentWodTimeCap}:00`, true);
    }
});

// SUBMIT RESULT
document.getElementById('submit-result-btn').addEventListener('click', async () => {
    const athleteId = parseInt(document.getElementById('athlete-select').value);
    const wodId = parseInt(document.getElementById('wod-select').value);

    if (!athleteId || !wodId) {
        return alert('Veuillez sélectionner un participant et un WOD');
    }

    const wod = wods.find(w => w.id === wodId);
    const isTimeWod = wod && wod.wod_type === 'time';

    // Prepare result data
    let resultData = {
        workout_id: wodId,
        athlete_id: athleteId
    };

    if (currentTournament.is_open) {
        const division = document.getElementById('selected-division').value;
        if (!division) return alert('⚠️ Veuillez sélectionner une division (RX, Scaled ou Found.)');
        resultData.division = division;
    }

    if (isTimeWod) {
        const isCompleted = document.getElementById('result-is-completed').checked;
        resultData.is_completed = isCompleted;

        if (isCompleted) {
            const minutes = parseInt(document.getElementById('result-minutes').value) || 0;
            const seconds = parseInt(document.getElementById('result-seconds').value) || 0;
            if (minutes === 0 && seconds === 0) return alert('Veuillez entrer un temps');
            if (seconds > 59) return alert('Les secondes doivent être entre 0 et 59');

            // Time cap validation - CRITICAL: prevent saving over time cap
            if (wod?.time_cap) {
                const totalSeconds = minutes * 60 + seconds;
                const capSeconds = wod.time_cap * 60;
                console.log(`Time cap check: ${minutes}:${seconds} (${totalSeconds}s) vs cap ${wod.time_cap} min (${capSeconds}s)`);

                if (totalSeconds > capSeconds) {
                    return alert(`⚠️ Temps invalide: ${minutes}:${seconds.toString().padStart(2, '0')}\n\nLe time cap est ${wod.time_cap}:00 maximum.\nSi l'athlète n'a pas terminé, décochez "Terminé dans le temps" et entrez les répétitions.`);
                }
            }
            resultData.value_time = minutes * 60 + seconds;
            resultData.value_int = null; // clear timecap reps if switching to completed
        } else {
            // Time cap — save reps as value_int and tiebreak time
            const reps = parseInt(document.getElementById('result-timecap-reps').value) || 0;
            if (reps === 0) return alert('Veuillez entrer le nombre de répétitions au time cap');

            const tiebreakMinutes = parseInt(document.getElementById('tiebreak-minutes').value) || 0;
            const tiebreakSeconds = parseInt(document.getElementById('tiebreak-seconds').value) || 0;

            if (tiebreakMinutes === 0 && tiebreakSeconds === 0) {
                return alert('Veuillez entrer le temps tiebreak (temps au moment où l\'athlète a atteint ces répétitions)');
            }
            if (tiebreakSeconds > 59) return alert('Les secondes du tiebreak doivent être entre 0 et 59');

            // Validate tiebreak time doesn't exceed time cap
            if (wod?.time_cap) {
                const tiebreakTotalSeconds = tiebreakMinutes * 60 + tiebreakSeconds;
                const capSeconds = wod.time_cap * 60;
                if (tiebreakTotalSeconds > capSeconds) {
                    return alert(`⚠️ Temps tiebreak invalide: ${tiebreakMinutes}:${tiebreakSeconds.toString().padStart(2, '0')}\n\nLe time cap est ${wod.time_cap}:00 maximum.`);
                }
            }

            resultData.value_int = reps;
            resultData.tiebreak_time = tiebreakMinutes * 60 + tiebreakSeconds;
            resultData.value_time = null; // clear time if switching to timecap
        }
    } else {
        const value = document.getElementById('result-value').value.trim();

        if (!value) {
            return alert('⚠️ Veuillez entrer un résultat');
        }

        const numValue = parseFloat(value);
        if (!isNaN(numValue)) {
            if (Number.isInteger(numValue)) {
                resultData.value_int = numValue;
            } else {
                resultData.value_decimal = numValue;
            }
        } else {
            resultData.notes = value;
        }
    }

    // Check if result already exists
    const { data: existing } = await supabase
        .from('scores')
        .select('id')
        .eq('workout_id', wodId)
        .eq('athlete_id', athleteId)
        .maybeSingle();

    console.log('Submitting result data:', resultData);
    console.log('Existing score:', existing);

    if (existing) {
        // Update existing result — exclude FK fields that identify the record
        const { workout_id: _w, athlete_id: _a, ...updateData } = resultData;
        const { error } = await supabase
            .from('scores')
            .update(updateData)
            .eq('id', existing.id);

        if (error) {
            console.error('Error updating result:', error);
            return showStatus('Erreur lors de la mise à jour', true);
        }

        showStatus('Résultat mis à jour avec succès!');
    } else {
        // Insert new result
        const { error } = await supabase.from('scores').insert(resultData);

        if (error) {
            console.error('Error saving result:', error);
            return showStatus('Erreur lors de la sauvegarde', true);
        }

        showStatus('Résultat enregistré avec succès!');
    }

    // Reset form
    document.getElementById('result-value').value = '';
    document.getElementById('result-minutes').value = '';
    document.getElementById('result-seconds').value = '';
    document.getElementById('result-timecap-reps').value = '';
    document.getElementById('tiebreak-minutes').value = '';
    document.getElementById('tiebreak-seconds').value = '';
    setWodCompleted(true);
    resetDivisionButtons();
    document.getElementById('athlete-select').value = '';
    document.getElementById('wod-select').value = '';
    document.getElementById('result-regular').classList.add('hidden');
    document.getElementById('result-time').classList.add('hidden');
    document.getElementById('wod-description').classList.add('hidden');
    document.getElementById('submit-result-btn').classList.add('hidden');
    document.getElementById('delete-result-btn').classList.add('hidden');
    existingScoreId = null;
});

// DELETE RESULT
document.getElementById('delete-result-btn').addEventListener('click', async () => {
    if (!existingScoreId) return;
    if (!confirm('⚠️ Supprimer ce résultat ?')) return;

    const { error } = await supabase.from('scores').delete().eq('id', existingScoreId);

    if (error) {
        console.error('Error deleting result:', error);
        return showStatus('Erreur lors de la suppression', true);
    }

    showStatus('✅ Résultat supprimé');

    // Reset form
    existingScoreId = null;
    document.getElementById('delete-result-btn').classList.add('hidden');
    document.getElementById('result-value').value = '';
    document.getElementById('result-minutes').value = '';
    document.getElementById('result-seconds').value = '';
    document.getElementById('result-timecap-reps').value = '';
    document.getElementById('tiebreak-minutes').value = '';
    document.getElementById('tiebreak-seconds').value = '';
    setWodCompleted(true);
    resetDivisionButtons();
    document.getElementById('athlete-select').value = '';
    document.getElementById('wod-select').value = '';
    document.getElementById('result-regular').classList.add('hidden');
    document.getElementById('result-time').classList.add('hidden');
    document.getElementById('wod-description').classList.add('hidden');
    document.getElementById('submit-result-btn').classList.add('hidden');
});
</script>

</body>
</html>
